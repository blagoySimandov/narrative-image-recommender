[project]
name = "narrative-image-recommender"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pydantic",
    "torch",
    "transformers",
    "accelerate",
    "pillow",
    "pillow-heif",
    "matplotlib",
    "polars",
    "altair>=6.3.0",
    "openrouter",
    "python-dotenv",
    "scipy>=1.17.1",
    "huggingface-hub>=1.32.0",
    "duckdb>=1.5.6",
    "sqlglot>=30.20.0",
    "marimo>=0.24.2",
    "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
notebook = ["marimo"]
dev = ["datamodel-code-generator"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.marimo.runtime]
pythonpath = ["."]
