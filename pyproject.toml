[project]
name = "narrative-image-recommender"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pydantic",
    "torch",
    "transformers",
    "accelerate",
    "pillow",
    "matplotlib",
]

[project.optional-dependencies]
notebook = ["marimo"]
dev = ["datamodel-code-generator"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
