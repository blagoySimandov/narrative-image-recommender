[project]
name = "narrative-image-recommender"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pydantic",
    "torch",
    "transformers",
    "accelerate",
    "pillow",
    "pillow-heif",
    "matplotlib",
    "polars",
    "altair>=6.3.0",
    "openrouter",
    "python-dotenv",
]

[project.optional-dependencies]
notebook = ["marimo"]
dev = ["datamodel-code-generator"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]
